<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex, nofollow">

    <title>
        Recover Account - Fire Of God Ministries
    </title>

    <script
        src="/js/account-recovery.js?v=1"
        defer
    ></script>

    <link
        rel="stylesheet"
        href="/css/styles.css?v=12.2"
    >
</head>

<body>
    <main
        class="container"
        style="
            max-width:460px;
            margin:40px auto;
            padding:20px;
        "
    >
        <section class="card">
            <img
                src="/img/logo.png"
                alt="Fire Of God Ministries"
                style="
                    display:block;
                    width:90px;
                    height:90px;
                    object-fit:contain;
                    margin:0 auto 20px;
                "
            >

            <h1
                style="
                    font-size:1.65rem;
                    text-align:center;
                "
            >
                Recover your Community Portal account
            </h1>

            <p
                id="accountRecoveryIntro"
                style="
                    color:var(--text-muted);
                    text-align:center;
                    line-height:1.55;
                "
            >
                Checking your secure recovery link…
            </p>

            <div
                id="accountRecoveryIdentity"
                style="
                    display:none;
                    margin:18px 0;
                    padding:16px;
                    background:#fff7ed;
                    border:1px solid #fed7aa;
                    border-radius:12px;
                "
            >
                <div
                    id="accountRecoveryMember"
                    style="
                        font-weight:800;
                        margin-bottom:8px;
                    "
                ></div>

                <div
                    style="
                        font-size:0.86rem;
                        color:var(--text-muted);
                    "
                >
                    Your Community Portal username:
                </div>

                <div
                    id="accountRecoveryUsername"
                    style="
                        font-weight:800;
                        overflow-wrap:anywhere;
                        margin-top:3px;
                    "
                ></div>
            </div>

            <form
                id="accountRecoveryForm"
                style="display:none;"
            >
                <div class="form-group">
                    <label for="accountRecoveryNew">
                        New password
                    </label>

                    <input
                        type="password"
                        id="accountRecoveryNew"
                        class="form-control"
                        minlength="8"
                        maxlength="128"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="accountRecoveryConfirm">
                        Confirm new password
                    </label>

                    <input
                        type="password"
                        id="accountRecoveryConfirm"
                        class="form-control"
                        minlength="8"
                        maxlength="128"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="btn btn-primary"
                    style="width:100%;"
                >
                    Set New Password
                </button>
            </form>

            <div
                id="accountRecoveryResult"
                role="status"
                aria-live="polite"
                style="
                    display:none;
                    margin-top:18px;
                    padding:14px;
                    border-radius:10px;
                    line-height:1.5;
                "
            ></div>

            <a
                href="/"
                class="btn btn-outline"
                style="
                    display:block;
                    text-align:center;
                    margin-top:12px;
                "
            >
                Back to Sign In
            </a>
        </section>
    </main>
</body>
</html>
