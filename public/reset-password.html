<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex, nofollow">
    <title>Reset Password - Fire Of God Ministries</title>
    <script src="/js/reset-password.js?v=1"></script>
    <link rel="stylesheet" href="/css/styles.css?v=12.2">
</head>
<body>
    <main class="container" style="max-width: 440px; margin: 40px auto; padding: 20px;">
        <section class="card">
            <img src="/img/logo.png" alt="Fire Of God Ministries" style="display: block; width: 90px; height: 90px; object-fit: contain; margin: 0 auto 20px;">
            <h1 style="font-size: 1.7rem; text-align: center;">Choose a new password</h1>
            <p id="resetPasswordIntro" style="color: var(--text-muted); text-align: center; line-height: 1.5;">Use 8 to 128 characters for your new Community Portal password.</p>
            <form id="resetPasswordForm">
                <div class="form-group">
                    <label for="resetPasswordNew">New password</label>
                    <input type="password" id="resetPasswordNew" class="form-control" minlength="8" maxlength="128" autocomplete="new-password" required>
                </div>
                <div class="form-group">
                    <label for="resetPasswordConfirm">Confirm new password</label>
                    <input type="password" id="resetPasswordConfirm" class="form-control" minlength="8" maxlength="128" autocomplete="new-password" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Reset password</button>
            </form>
            <div id="resetPasswordResult" role="status" aria-live="polite" style="display: none; margin-top: 18px; padding: 14px; border-radius: 10px; line-height: 1.5;"></div>
            <a href="/" class="btn btn-outline" style="display: block; text-align: center; margin-top: 12px;">Back to Sign In</a>
        </section>
    </main>
</body>
</html>
